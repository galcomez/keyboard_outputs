name: Build and Sign Executable

on:
  release:
    types: [created]

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: pyinstaller --onefile keyboard_outputs.py

    - name: Submit to SignPath for Free Signing
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        project-slug: 'keyboard_outputs'
        signing-policy-slug: 'release-signing'
        artifact-path: 'dist/keyboard_outputs.exe'
        output-path: 'signed_dist/'

    - name: Upload Signed EXE to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: signed_dist/keyboard_outputs.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
